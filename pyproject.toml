[project]
name = "gmail-calendar"
version = "0.1.0"
description = "MCP server (stdio) for searching Gmail, writing drafts and managing Google Calendar."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",  # FastMCP API; renamed to MCPServer in mcp 2.x
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "tzdata>=2024.1",
]
